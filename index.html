<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="title-block">
        <h1>2048</h1>
        <p class="subtitle">merge tiles, reach the target</p>
      </div>
      <div class="stat-block">
        <div class="stat">
          <span class="stat-label">score</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">best</span>
          <span class="stat-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="controls-row">
      <p class="hint">use arrow keys or swipe</p>
      <button class="new-game-btn" id="newGameBtn">new game</button>
    </div>

    <div class="board-wrap">
      <div class="grid-bg" id="gridBg"></div>
      <div class="tiles-layer" id="tilesLayer"></div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay-content">
          <p class="overlay-message" id="overlayMessage">game over</p>
          <button class="new-game-btn" id="overlayBtn">try again</button>
        </div>
      </div>
    </div>

    <footer class="foot-note">
      <p>built from scratch — no libraries</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
